name: Build Android APK

on:
  # Manual-only for now: GameCI Unity build needs a Personal license .ulf
  # uploaded as UNITY_LICENSE secret (see https://game.ci/docs/github/activation).
  # Until that's set up, building locally and attaching the APK to the PR.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build TrashRoyale APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build Android APK (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2022.3.55f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: TrashRoyale
          androidAppBundle: false
          allowDirtyBuild: true
          buildMethod: TrashRoyale.EditorTools.BuildScript.BuildAndroid

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrashRoyale-Android
          path: Builds/*.apk
          if-no-files-found: error

      - name: Attach APK to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'Builds';
            if (fs.existsSync(dir)) {
              const apks = fs.readdirSync(dir).filter(f => f.endsWith('.apk'));
              if (apks.length > 0) {
                console.log('APK ready:', apks);
              }
            }
