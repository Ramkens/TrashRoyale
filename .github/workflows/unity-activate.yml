name: Unity Request Activation File

# One-shot helper: generates an Unity activation request file (.alf)
# and uploads it as a workflow artifact. The user uploads that .alf to
# https://license.unity3d.com to receive a .ulf, which is then added
# as the UNITY_LICENSE secret used by build-apk.yml.
on:
  workflow_dispatch:

jobs:
  request-activation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manual activation file
        uses: game-ci/unity-request-activation-file@v2
        id: getManualLicenseFile
        with:
          unityVersion: 2022.3.55f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
